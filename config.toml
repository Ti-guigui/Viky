# Configuration de Viky — modifiez ce fichier puis relancez Viky.

[general]
langue = "fr"                    # langue de réponse par défaut : "fr" ou "en"
langues_ecoute = ["fr", "en"]    # langues comprises (retirez "en" pour économiser de la mémoire)
# Variantes acceptées pour le prénom. Si Viky ne vous répond pas, regardez la ligne
# « Entendu : … » dans la fenêtre et ajoutez ici le mot qu'elle a compris à la place de « Viky ».
mots_de_reveil = ["viky", "vicky", "vicki", "viki", "vikki", "mickey", "mikey", "wiki"]
duree_eveil = 8                  # secondes pendant lesquelles Viky écoute après son nom
double_clap = true               # se réveiller en tapant deux fois dans les mains
sensibilite_clap = 0.5           # de 0 (peu sensible) à 1 (très sensible)
vitesse_voix = 180               # vitesse de parole

[interface]
# "widget" = petit réacteur dans un coin (double-clic pour le HUD), "hud" = grand écran Jarvis,
# "aucune" = pas de fenêtre. À la voix : « Viky, mode Jarvis » / « Viky, mode discret ».
mode = "widget"

[reconnaissance]
# "whisper" = très précis (recommandé), "vosk" = léger mais moins précis
moteur = "whisper"
taille_whisper = "auto"    # auto = large-v3-turbo sur carte NVIDIA, small sur processeur
appareil = "auto"          # "auto" = carte graphique NVIDIA si possible, sinon processeur

[voix]
# "piper" = voix naturelle (recommandé), "systeme" = voix de Windows
moteur = "piper"
voix_fr = "fr_FR-siwis-medium"   # autres voix : fr_FR-upmc-medium, fr_FR-tom-medium (voix d'homme)
voix_en = "en_US-amy-medium"
vitesse = 1.0                    # 1.2 = plus rapide, 0.9 = plus lent

[fichiers]
# Viky cherche vos fichiers dans Bureau, Documents, Téléchargements, Images et Vidéos
# (y compris OneDrive). Ajoutez ici d'autres dossiers, par exemple celui de vos spectacles :
dossiers = [
  # 'C:\Users\Moi\Spectacles',
]

[projecteur]
# true = le diaporama s'affiche sur le projecteur, et vos notes (mode présentateur) sur le PC
vue_presentateur = false

[meteo]
# Laissez vide pour que Viky trouve votre ville automatiquement (d'après votre connexion internet).
ville = ""

[actualites]
nombre_de_titres = 5
# Flux RSS utilisés (laissez commenté pour garder France Info / Le Monde et BBC) :
# flux_fr = ["https://www.francetvinfo.fr/titres.rss", "https://www.lemonde.fr/rss/une.xml"]
# flux_en = ["https://feeds.bbci.co.uk/news/world/rss.xml"]

[ia]
# IA locale gratuite (Ollama, https://ollama.com) pour les questions courantes
ia_locale = true
modele_local = "qwen2.5:7b"       # idéal pour une RTX 3070 ; sur un PC modeste : "qwen2.5:3b"
adresse_ollama = "http://localhost:11434"

# Claude pour les recherches complètes et l'actualité approfondie (payant, internet requis).
# Collez votre clé ici, ou mettez-la dans la variable d'environnement ANTHROPIC_API_KEY.
claude = true
modele_claude = "claude-opus-5-5"
cle_claude = ""

[magie]
mode_spectacle = false    # démarrer directement en mode spectacle
telecommande = true       # télécommande secrète sur le téléphone (même Wi-Fi que le PC)
code_pin = ""             # code de la télécommande (vide = un nouveau code à chaque lancement)
port = 8765

# Mots-codes : en mode spectacle, quand vous prononcez cette phrase (n'importe où dans
# une phrase, sans dire « Viky »), l'effet se déclenche en silence.
# Effets : reveler, deviner, noir, effacer, dire, afficher, charger, projeter, suivant, precedent
[[magie.codes]]
phrase = "regardez bien l'écran"
effet = "reveler"

[[magie.codes]]
phrase = "faisons le noir"
effet = "noir"

[[magie.codes]]
phrase = "je sens une présence"
effet = "dire"
valeur = "Je suis là. Et je vois tout."

# Répliques préparées : quand on dit cette phrase, Viky répond exactement le texte indiqué.
[magie.repliques]
"es-tu prête" = "Toujours. Je suis née prête."
"présente-toi au public" = "Bonsoir à toutes et à tous. Je suis Viky, l'assistante du magicien. Ne me quittez pas des yeux… ni des oreilles."

[comptes]
# Adresses e-mail (les mots de passe sont rangés à part : lancez configurer_comptes.bat)
# gmail = "vous@gmail.com"
# icloud = "vous@icloud.com"
envoi = "gmail"              # compte utilisé pour envoyer : "gmail" ou "icloud"
calendrier_icloud = ""       # calendrier iCloud où ajouter les rendez-vous (vide = le premier)

[contacts]
# Pour « Viky, envoie un mail à Paul » : nom prononcé = adresse
# "paul" = "paul.martin@gmail.com"
# "maman" = "maman@icloud.com"

[applications]
# Ajoutez vos propres applications : "nom prononcé" = "commande ou chemin complet"
# "mon jeu" = 'C:\Jeux\MonJeu\jeu.exe'
# "spotify" = 'shell:AppsFolder\SpotifyAB.SpotifyMusic_zpdnekdrzrea0!Spotify'

[sites]
# Ajoutez vos propres sites : "nom prononcé" = "adresse"
# "mon blog" = "https://exemple.com"
